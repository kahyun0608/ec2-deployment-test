name: Java CI/CD with Gradle

# 동작 조건 설정: develop 브랜치에 push or pull request가 발생할 경우 동작
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  # Spring Boot 애플리케이션을 빌드하여 Docker Hub에 Push하는 과정
  build-docker-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Java 21 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      # 2. gradlew 권한 부여
      - name: Run chmod to make gradlew executable
        run: chmod +x gradlew

      # 3. Spring Boot 애플리케이션 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 4. bootJar를 통해 build
      - name: gradlew bootJar
        run: ./gradlew bootJar

      # 5. Docker 이미지 빌드 & Push
      - name: Docker Image Build & Push
        run: |
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
          docker build  --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/9kcal:3 .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/9kcal:3

  pull-images-and-run:

    # 위의 단계가 전부 실행되어야 실행
    needs: build-docker-image

    #self-hosted-runner 에서 동작
    runs-on: self-hosted

    steps:
      - name: SSH Commands
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            docker pull kahyunjung/9kcal:3 
            docker run -p 8080:8080 -d --env-file .env kahyunjung/9kcal:3